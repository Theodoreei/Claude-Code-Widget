name: ClaudeWidget
options:
  bundleIdPrefix: com.eisemon
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: W4MBZ59CH2
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  ClaudeWidget:
    type: application
    platform: macOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Claude Widget
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
    entitlements:
      path: App/ClaudeWidget.entitlements
      properties:
        com.apple.security.application-groups: [W4MBZ59CH2.com.eisemon.ClaudeWidget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eisemon.ClaudeWidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: ClaudeWidgetExtension
        embed: true
  ClaudeWidgetExtension:
    type: app-extension
    platform: macOS
    sources: [Widgets, Shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Claude Code
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/ClaudeWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [W4MBZ59CH2.com.eisemon.ClaudeWidget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eisemon.ClaudeWidget.Widgets
